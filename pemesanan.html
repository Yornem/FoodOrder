<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan</title>
<!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">
<!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FoodOrder</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pemesanan.html">Pemesanan</a></li>
                    <li class="nav-item"><a class="nav-link" href="data.html">Data Pesanan</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">

        <div class="card custom-card p-4 shadow">

            <h2 class="text-center mb-4">
                Form Pemesanan Makanan
            </h2>

            <form>
<!-- Teks -->
                <div class="mb-3">
                    <label class="form-label">
                        Nama Pelanggan
                    </label>

                    <input type="text" class="form-control" placeholder="Masukkan nama pelanggan">
                </div>
<!-- Date -->
                <div class="mb-3">
                    <label class="form-label">
                        Tanggal Pembelian
                    </label>

                    <input type="date" class="form-control">
                </div>
<!-- Radio -->
                <div class="mb-3">
                    <label class="form-label d-block">
                        Jenis Pesanan
                    </label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jenis">

                        <label class="form-check-label">
                            Dine In
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="jenis">

                        <label class="form-check-label">
                            Take Away (+Rp2.000)
                        </label>
                    </div>
                </div>
<!-- CheckBox -->
                <div class="mb-3">
                    <label class="form-label d-block">
                        Pilih Menu
                    </label>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="nasi">
                        <label class="form-check-label" for="nasi">
                            Nasi Goreng - Rp15.000
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ayam">
                        <label class="form-check-label" for="ayam">
                            Ayam Geprek - Rp18.000
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="mie">
                        <label class="form-check-label" for="mie">
                            Mie Goreng - Rp12.000
                        </label>
                    </div>
                </div>
<!-- Select -->
                <div class="mb-3">
                    <label class="form-label">
                        Nomor Meja
                    </label>

                    <select class="form-select">
                        <option selected>Pilih Meja</option>
                        <option>Meja 1</option>
                        <option>Meja 2</option>
                        <option>Meja 3</option>
                        <option>Meja 4</option>
                        <option>Take Away</option>
                    </select>
                </div>
<!-- Number -->
                <div class="mb-3">
                    <label class="form-label">
                        Jumlah Pesanan
                    </label>

                    <input type="number" class="form-control" placeholder="Masukkan jumlah">
                </div>
<!-- Text Area -->
                <div class="mb-3">
                    <label class="form-label">
                        Catatan Tambahan
                    </label>

                    <textarea class="form-control" rows="3" placeholder="Contoh: tidak pedas"></textarea>
                </div>
<!-- Upload File -->
                <div class="mb-3">
                    <label class="form-label">
                        Upload Voucher
                    </label>

                    <input type="file" class="form-control">
                </div>
<!-- Button -->
                <button type="submit" class="btn btn-warning custom-btn">
                    Simpan
                </button>

                <button type="reset" class="btn btn-dark custom-btn">
                    Reset
                </button>

            </form>
        </div>
    </main>

<!-- Navbar -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 FoodOrder</p>
    </footer>
</body>

</html>
